name: CI

on:
  push:
    branches: [main]
    # Skip check + deploy for docs-only pushes to main. Listed by name, NOT
    # `**.md` — content pages live in content/ as Markdown embedded in the
    # binary, so a content addition MUST still deploy. PRs (below) have no
    # filter, so their checks always run; merge behavior is unaffected.
    paths-ignore:
      - 'CLAUDE.md'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Denied restriction lints fail here; pedantic/nursery stay warnings by design.
      - run: cargo clippy --all-targets
      - run: cargo test

  deploy:
    name: Deploy
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
